[package]
name = "simple-markdown-parser"
description = "A simple library for handling markdown. May include extra utilities"
license = "MIT"
repository = "https://github.com/kaleidawave/simple-markdown-parser"
version = "0.0.7"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "markdown-query"
path = "./examples/query.rs"

[features]
default = ["yaml"] # "html"
# extras = []
# utilities = []
# For frontmatter
yaml = ["dep:simple-yaml-parser"]
# html = ["dep:lightml"]

[dependencies]
# lightml.version = "*", lightml.optional = true, lightml.branch = "fixes1", lightml.git = "https://github.com/kaleidawave/lightml", lightml.features = ["markdown_code_blocks_in_html"]

simple-yaml-parser.version = "*"
simple-yaml-parser.optional = true
# simple-yaml-parser.branch = "fixes1", simple-yaml-parser.git = "https://github.com/kaleidawave/simple-yaml-parser"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.*"
tsify = { version = "0.4", features = ["js"] }
js-sys = "0.3"
console_error_panic_hook = "=0.1.7"

[[test]]
name = "specification"
harness = false

[dev-dependencies]
codespan-reporting = "0.*"
glob = "0.3.2"
pretty_assertions = "1.3.0"

[lints.clippy]
missing_panics_doc = "allow"
missing_errors_doc = "allow"
result_unit_err = "allow"
pedantic = { level = "warn", priority = -1 }
